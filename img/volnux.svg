<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Volnux">
  <title>Volnux</title>
  <defs>
    <linearGradient id="vxWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="vxA" gradientUnits="userSpaceOnUse" x1="60" y1="48" x2="128" y2="148">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="vxB" gradientUnits="userSpaceOnUse" x1="196" y1="48" x2="128" y2="148">
      <stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="vxOut" gradientUnits="userSpaceOnUse" x1="128" y1="148" x2="128" y2="232">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g transform="translate(78 16) scale(0.95 0.95)">
    <!-- two branches converge (fork/join) into one flow that continues: the V of Volnux -->
    <path d="M60 48 L128 148" stroke="url(#vxA)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M196 48 L128 148" stroke="url(#vxB)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M128 148 L128 196" stroke="url(#vxOut)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M100 192 L156 192 L128 234 Z" fill="url(#vxOut)" stroke="url(#vxOut)" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="60" cy="48" r="26" fill="url(#vxA)"/>
    <circle cx="60" cy="48" r="10" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="196" cy="48" r="26" fill="url(#vxB)"/>
    <circle cx="196" cy="48" r="10" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="128" cy="148" r="32" fill="url(#vxOut)"/>
    <circle cx="128" cy="148" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="5"/>
    <circle cx="128" cy="148" r="7" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="url(#vxWord)">volnux</text>
  <text x="200" y="372" text-anchor="middle" font-family="Inter, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="3" fill="#64748B">WORKFLOW ORCHESTRATION</text>
</svg>
